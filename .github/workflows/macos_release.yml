name: macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS App (ZIP & DMG)
        run: |
          mkdir -p dist
          APP_PATH="build/macos/Build/Products/Release/thaili.app"
          
          # Copy instructions
          if [ -f "dist_docs/HOW_TO_RUN_MACOS.txt" ]; then
            cp "dist_docs/HOW_TO_RUN_MACOS.txt" "build/macos/Build/Products/Release/HOW_TO_RUN.txt"
          fi

          # Create Portable ZIP
          cd build/macos/Build/Products/Release
          zip -r -q "$GITHUB_WORKSPACE/dist/Thaili-macOS-Portable.zip" "thaili.app" "HOW_TO_RUN.txt"
          cd "$GITHUB_WORKSPACE"

          # Create Native DMG with instructions
          mkdir -p build/dmg_temp
          cp -R "$APP_PATH" build/dmg_temp/
          if [ -f "dist_docs/HOW_TO_RUN_MACOS.txt" ]; then
            cp "dist_docs/HOW_TO_RUN_MACOS.txt" build/dmg_temp/HOW_TO_RUN.txt
          fi
          hdiutil create -volname "Thaili" -srcfolder build/dmg_temp -ov -format UDZO "dist/Thaili-macOS-Installer.dmg"
          rm -rf build/dmg_temp

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Thaili-macOS-Release
          path: dist/*
          retention-days: 14

      - name: Add to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
